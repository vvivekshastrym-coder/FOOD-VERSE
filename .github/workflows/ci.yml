name: FoodVerse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client & Sync DB
      run: |
        npx prisma db push
        npx prisma generate
        npm run seed

    - name: Run Automated Acceptance & Security Tests
      run: npm test

    - name: Build Next.js Application
      run: npm run build
