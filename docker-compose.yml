version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodverse-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/prod.db
      - JWT_SECRET=foodverse_super_secret_production_key_2026
    volumes:
      - foodverse-data:/app/prisma

volumes:
  foodverse-data:
